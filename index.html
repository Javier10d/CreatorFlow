<style type="text/tailwindcss">
@layer components{
.card{@apply rounded-2xl border border-line bg-panel/70 p-5 transition duration-300}
.lift:hover{@apply -translate-y-1 border-violet shadow-xl shadow-violet/20}
.btn{@apply rounded-full bg-violet px-5 py-2.5 text-sm font-bold hover:bg-[#8f73ff]}
.btn-s{@apply rounded-full bg-shop px-5 py-2.5 text-sm font-bold hover:bg-[#00a37c] disabled:opacity-60}
.chip{@apply rounded-full border border-line px-3 py-1.5 text-sm hover:border-cyan}
.chip.on{@apply border-cyan bg-cyan/15}
.inp{@apply w-full rounded-xl border border-line bg-ink p-3 text-sm}
.lbl{@apply mb-1 mt-3 block text-xs text-mist}
.tab{@apply flex shrink-0 items-center gap-2 rounded-full px-4 py-2 text-sm font-medium text-mist transition hover:text-white}
.tab.on{@apply bg-violet text-white shadow-lg shadow-violet/40}}
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:radial-gradient(900px 500px at 85% -10%,#2a1a7a66,transparent),#07051A}
@keyframes rot{from{transform:rotateX(-6deg) rotateY(0)}to{transform:rotateX(-6deg) rotateY(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes grow{from{height:4%}}@keyframes glow{0%,20%,100%{border-color:#2A2F55}8%{border-color:#3DF5FF;box-shadow:0 0 28px #3DF5FF55}}
@keyframes b{50%{opacity:.3}}
.pop{animation:pop .7s both}.live{animation:b 1.4s infinite}.glow{animation:glow 6s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #3DF5FF;outline-offset:2px}

<body class="font-sans text-white antialiased">

<label class="chip mt-3 inline-block cursor-pointer">📎 Subir foto de fondo<input type="file" accept="image/*" class="sr-only" onchange="bg(this)"></label></div>

<script>
/* ===== Estado global (en producción: Zustand + API de Next.js) ===== */
const $=s=>document.querySelector(s),fmt=n=>lang==='en'?'€'+n.toFixed(2):n.toFixed(2).replace('.',',')+' €',rnd=(a,b)=>a+Math.random()*(b-a);
const DEF='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#FF9B6B"/><text x="50" y="64" text-anchor="middle" font-size="40" font-weight="800" font-family="sans-serif" fill="#0F1226">NV</text></svg>');
const CW={negro:'#14141f',blanco:'#F4F2FF',gris:'#8A8FA8',rojo:'#EF4444',burdeos:'#7B1E3A',naranja:'#FF9B6B',amarillo:'#FFD84D',beige:'#D9C7A5',verde:'#00A87E',turquesa:'#14B8A6',azul:'#3B82F6',marino:'#1E2A5A',morado:'#7C5CFF',rosa:'#FF4FD8'};
const PD={hoodie:{n:'Sudadera con capucha',p:44.9,c:[100,112],d:'M62 48 C48 54 30 62 22 70 L30 124 C38 120 46 116 54 112 L54 178 Q100 184 146 178 L146 112 C154 116 162 120 170 124 L178 70 C170 62 152 54 138 48 C140 20 124 8 100 8 C76 8 60 20 62 48Z',
f:'<path d="M78 46 C84 26 116 26 122 46 C112 62 88 62 78 46Z" fill="#000" opacity=".5"/><path d="M84 44 C90 32 110 32 116 44" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3"/><path d="M92 58 Q90 78 93 92 M108 58 Q110 78 107 92" stroke="#eee" stroke-width="2.4" fill="none"/><circle cx="93" cy="94" r="2" fill="#ddd"/><circle cx="107" cy="94" r="2" fill="#ddd"/><path d="M66 142 H134 L128 170 H72Z" fill="#000" fill-opacity=".1" stroke="#000" stroke-opacity=".3" stroke-width="1.5"/><rect x="54" y="170" width="92" height="9" fill="#000" opacity=".2"/><path d="M24 112 L36 118 M176 112 L164 118" stroke="#000" stroke-opacity=".35" stroke-width="5"/>',
b:'<path d="M70 44 C80 72 120 72 130 44" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="2"/><rect x="54" y="170" width="92" height="9" fill="#000" opacity=".2"/>',w:['M54 114 Q70 126 80 152 M146 114 Q130 126 120 152 M30 88 Q40 98 36 116 M60 162 Q100 172 140 162','M170 90 Q160 100 164 116 M84 74 Q100 96 116 74']},
tee:{n:'Camiseta oversize',p:29.9,c:[100,100],d:'M68 26 C58 30 40 38 24 52 L38 92 C46 88 52 84 58 82 L58 172 Q100 178 142 172 L142 82 C148 84 154 88 162 92 L176 52 C160 38 142 30 132 26 C124 40 76 40 68 26Z',
f:'<path d="M78 28 C86 46 114 46 122 28" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="4"/><rect x="58" y="164" width="84" height="8" fill="#000" opacity=".14"/><path d="M28 58 L41 90 M172 58 L159 90" stroke="#000" stroke-opacity=".3" stroke-width="2"/>',b:'<path d="M78 28 C86 38 114 38 122 28" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="3"/><rect x="58" y="164" width="84" height="8" fill="#000" opacity=".14"/>',w:['M58 84 Q70 102 74 132 M142 84 Q130 102 126 132 M62 150 Q100 162 138 150','M84 70 Q100 92 118 70 M100 110 Q96 130 100 150']},
cap:{n:'Gorra',p:24.9,c:[100,82],d:'M34 118 C32 60 66 36 100 36 C134 36 168 60 166 118 Z M26 118 C60 158 140 158 174 118 C140 132 60 132 26 118Z',
f:'<path d="M100 36 V124 M100 38 C80 56 70 90 68 122 M100 38 C120 56 130 90 132 122" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="1.5"/><circle cx="100" cy="37" r="4" fill="#000" opacity=".35"/><path d="M26 118 C60 158 140 158 174 118 C140 132 60 132 26 118Z" fill="#000" opacity=".3"/>',b:'<path d="M100 36 V124 M100 38 C80 56 70 90 68 122 M100 38 C120 56 130 90 132 122" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="1.5"/><rect x="82" y="106" width="36" height="8" rx="3" fill="#000" opacity=".3"/>',w:['M46 96 Q58 84 70 96','M130 70 Q146 84 150 100']}};
const PL={hoodie:[0,-4,36],tee:[0,-2,36],cap:[0,-2,24]};
const FD=`<defs><filter id="fab" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/><feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="1.4" result="l"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="l" in2="SourceAlpha" operator="in" result="lc"/><feBlend in="SourceGraphic" in2="lc" mode="multiply"/></filter><filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="1" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="4" result="d"/><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="5" result="n"/><feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="1.2" result="l"><feDistantLight azimuth="235" elevation="62"/></feDiffuseLighting><feComposite in="l" in2="d" operator="in" result="lc"/><feBlend in="d" in2="lc" mode="multiply"/></filter><filter id="bl"><feGaussianBlur stdDeviation="2.2"/></filter><radialGradient id="lt" cx=".32" cy=".22" r=".95"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient></defs>`;
const S={txt:'',tcol:'#FFFFFF',tsz:14,hs:0,ht:0,mode:1,raw:null,ar:1,auto:1,drag:null,a0:0,logo:DEF,fn:'logo-demo.svg',prod:'hoodie',col:'#7C5CFF',face:'front',lx:0,ly:0,ls:34,ang:0,play:0,vt:0,sc:0,vf:'desk',tab:'home',store:null,pub:false,dsg:null,brand:'Nova',tpl:[
{n:'Carrito abandonado',s:'Tu pedido te espera',b:'Dejaste algo en tu carrito. Se produce en España y llega en menos de 3 días.',o:''},
{n:'Pedido y seguimiento',s:'¡Gracias! Tu pedido está en marcha',b:'Ya estamos imprimiendo tu pedido. Mañana te enviamos el número de seguimiento.',o:''},
{n:'Promoción a tus fans',s:'Una sorpresa para ti',b:'Solo para mi comunidad: esta semana tienes un descuento especial.',o:'-15%'}],em:0,ads:null,mail:null,alerts:[],maxCpa:12,
chat:[{r:'ai',t:'Hola, soy tu asistente. Pídeme cosas como: “sudadera negra con el logo en la espalda”, “crea una oferta del 20%”, “añade un pop-up de bienvenida”.'}]};

/* ===== Producto en 3D real: capas extruidas con perspectiva (en producción: Three.js + modelos GLB) ===== */
function d3(t,col,face,lx,ly,ls,ang,sz,auto){const p=PD[t],N=6,st=sz/300*3,h=N/2*st;
const lg=on=>on?`<image href="${S.logo}" x="${p.c[0]+lx-ls/2}" y="${p.c[1]+ly-ls/2}" width="${ls}" height="${ls}" filter="url(#ink)" opacity=".96"/>`:'';
const tx=bk=>{if(!S.txt)return'';const on=bk?(face==='back'||face==='both'):face!=='back';return on?`<text x="${p.c[0]+lx}" y="${p.c[1]+ly+ls/2+S.tsz*.9}" text-anchor="middle" font-size="${S.tsz}" font-weight="800" font-family="Arial Black,Impact,sans-serif" fill="${S.tcol}" filter="url(#ink)">${S.txt.replace(/[<&]/g,'')}</text>`:''};
const fc=bk=>`${FD}<clipPath id="cp${t}"><path d="${p.d}"/></clipPath><path d="${p.d}" fill="${col}" filter="url(#fab)"/><g clip-path="url(#cp${t})"><g filter="url(#bl)" fill="none" stroke-linecap="round"><path d="${p.w[0]}" stroke="#000" stroke-opacity=".32" stroke-width="5"/><path d="${p.w[1]}" stroke="#fff" stroke-opacity=".18" stroke-width="5"/></g>${bk?p.b:p.f}${lg(bk?face==='back'||face==='both':face==='front'||face==='both')}${tx(bk)}<path d="${p.d}" fill="url(#lt)"/></g><path d="${p.d}" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="1.6"/>`;
const sv=(i,tr)=>`<svg viewBox="0 0 200 200" style="position:absolute;inset:0;width:100%;height:100%;transform:${tr}">${i}</svg>`;
let L='';for(let i=0;i<N-1;i++)L+=sv(`<path d="${p.d}" fill="${col}" style="filter:brightness(${.62+i*.04})"/>`,`translateZ(${(i-N/2+1)*st}px)`);
L+=sv(fc(0),`translateZ(${h}px)`)+sv(fc(1),`rotateY(180deg) translateZ(${h}px)`);
return `<div style="perspective:900px;position:relative;display:grid;place-items:center"><div style="position:absolute;bottom:2%;left:18%;right:18%;height:7%;background:#000;opacity:.55;filter:blur(12px);border-radius:50%"></div><div class="rt" style="will-change:transform;width:${sz}px;height:${sz}px;position:relative;transform-style:preserve-3d;transform:rotateX(-6deg) rotateY(${ang}deg);${auto?'animation:rot 9s linear infinite':''}">${L}</div></div>`}
const D=(t,sz,auto,ang)=>d3(t,S.dsg?.col||S.col,S.dsg?.face||S.face,S.lx,S.ly,S.ls,ang||0,sz,auto);

/* ===== Navegación ===== */
const T={home:'🏠 Inicio',gen:'1 · Productos 3D',shop:'2 · Tienda',ads:'3 · Meta Ads',mail:'4 · Email',log:'5 · Logística',vid:'6 · Vídeos'};

function go(t){S.tab=t;clearInterval(S.play);S.play=0;clearInterval(S.vt);clearInterval(S.ht);nav();$('#main').innerHTML=V[t]();B[t]&&B[t]();scrollTo(0,0)}
const lock=m=>`<div class="card text-center"><p class="text-mist">${m}</p><button class="btn mt-4" onclick="go('shop')">Ir a Tienda</button></div>`;
const H=(a,b)=>`<h1 class="font-display text-3xl font-extrabold sm:text-5xl">${a}</h1><p class="mt-3 max-w-2xl text-mist">${b}</p>`;

const V={
/* ===== INICIO ===== */
home:()=>`<section class="grid items-center gap-8 lg:grid-cols-2"><div><p class="inline-block rounded-full border border-cyan px-4 py-1 text-sm font-bold text-cyan">${X('Actualización · Día 3 del Tetr LaunchLab','Update · Day 3 of the Tetr LaunchLab')}</p>
<h1 class="mt-4 font-display text-5xl font-extrabold leading-none sm:text-7xl">CreatorFlow Studio</h1>

<p class="mt-3 max-w-xl text-mist">${X('Hecho para creadores europeos con comunidades activas en YouTube, Twitch e Instagram.','Built for European creators with active communities on YouTube, Twitch and Instagram.')}</p>
<div class="mt-7 flex flex-wrap gap-3"><button class="btn !px-7 !py-3.5" onclick="go('gen')">${X('Probar el estudio 3D','Try the 3D studio')}</button><button class="chip !px-6 !py-3" onclick="go('vid')">${X('▶ Ver la demo','▶ Watch the demo')}</button></div></div>
<div class="card flex h-96 items-center justify-center">${D('hoodie',320,true)}</div></section>
<section class="mt-14 card"><h2 class="font-display text-2xl font-bold">${X('¿Para quién es?','Who is it for?')}</h2><div class="mt-4 grid items-center gap-4 md:grid-cols-3"><div><p class="font-display text-5xl font-extrabold text-pink">50k–200k</p><p class="text-mist">${X('seguidores con una comunidad activa','followers with an active community')}</p></div>
<p class="md:col-span-2">${X('Creadores de contenido europeos de nivel medio-alto que quieren lanzar merch propio sin riesgo económico ni operativo.','European mid-to-top tier content creators who want to launch their own merch without financial or operational risk.')}</p></div>
<div class="mt-4 flex gap-2"><span class="chip">YouTube</span><span class="chip">Twitch</span><span class="chip">Instagram</span></div></section>
<h2 class="mt-14 font-display text-3xl font-extrabold">${X('Los 3 problemas que resolvemos','The 3 pains we solve')}</h2>
<div class="mt-5 grid gap-4 md:grid-cols-3">${[['Costes iniciales y riesgo financiero','High upfront costs and financial risk','Comprar stock al por mayor antes de saber si se venderá.','Buying bulk inventory before knowing if it will sell.'],['Pesadilla logística','A logistical nightmare','Fabricación, embalaje, envíos internacionales y devoluciones.','Manufacturing, packaging, global shipping and returns.'],['Configuración técnica fragmentada','Fragmented technical setups','Herramientas sueltas y poca integración entre plataformas.','Disconnected tools and little platform integration.']].map((x,i)=>`<div class="card lift"><div class="text-3xl text-peach">✕</div><p class="mt-2 font-display text-lg font-bold">${X(x[0],x[1])}</p><p class="mt-1 text-sm text-mist">${X(x[2],x[3])}</p></div>`).join('')}</div>
<h2 class="mt-14 font-display text-3xl font-extrabold">${X('Lo que consigues','What you get')}</h2>
<div class="mt-5 grid gap-4 md:grid-cols-3">${[['Riesgo cero','Zero risk','Lanza tu marca de merch con cero stock y cero riesgo financiero inicial.','Launch your custom merch brand with zero stock and zero upfront financial risk.'],['Logística automática','Automated logistics','Fabricación y envío local automatizados en España, con entrega fiable en menos de 3 días.','Fully automated local fulfillment in Spain with fast, reliable delivery in under 3 days.'],['Simple y rápido','Simple and fast','Del diseño a la tienda activa en 5 pasos con herramientas de IA.','From design to active storefront in 5 simple steps using AI-powered tools.']].map(x=>`<div class="card lift border-ok"><p class="font-display text-xl font-bold text-ok">✓ ${X(x[0],x[1])}</p><p class="mt-2 text-sm">${X(x[2],x[3])}</p></div>`).join('')}</div>
<h2 class="mt-14 font-display text-3xl font-extrabold">${X('Del diseño a tu tienda activa en 5 pasos','From design to a live store in 5 steps')}</h2><div id="hsw" class="mt-5"></div>

<div class="mt-5 grid gap-6 lg:grid-cols-2"><div class="card"><div class="flex gap-2"><button id="m0" class="chip" onclick="setMode(0)">${X('Merch tradicional','Traditional merch')}</button><button id="m1" class="chip" onclick="setMode(1)">CreatorFlow</button></div><ul id="mm" class="mt-4 space-y-3 text-sm"></ul></div>
<div class="card"><p class="font-bold">${X('Calcula el riesgo que te ahorras','Calculate the risk you avoid')}</p><p class="text-xs text-mist">${X('Ejemplo con tus propios números: edítalos.','Example with your own numbers: edit them.')}</p>
<label class="lbl" for="cu">${X('Unidades que comprarías por adelantado','Units you would buy upfront')}</label><input id="cu" type="number" min="0" value="500" class="inp" oninput="calc()"><label class="lbl" for="cc">${X('Coste por unidad (€)','Cost per unit (€)')}</label><input id="cc" type="number" min="0" value="12" class="inp" oninput="calc()">
<div class="mt-4 grid grid-cols-2 gap-3 text-center"><div class="rounded-xl bg-ink p-3"><p class="text-xs text-mist">${X('Merch tradicional','Traditional merch')}</p><p id="rk" class="font-display text-2xl font-bold text-peach"></p></div><div class="rounded-xl bg-ink p-3"><p class="text-xs text-mist">CreatorFlow</p><p class="font-display text-2xl font-bold text-ok">${fmt(0)}</p></div></div></div></div>
<div class="mt-6 grid items-center gap-3 text-center text-sm md:grid-cols-7">${[['Creador (B2B)','Creator (B2B)'],null,['CreatorFlow Studio','CreatorFlow Studio'],null,['Talleres en España','Spanish workshops'],null,['Fans (B2C)','Fans (B2C)']].map(x=>x?`<div class="card !p-3 font-bold">${X(x[0],x[1])}</div>`:'<div class="text-2xl text-cyan">→</div>').join('')}</div>
<section class="mt-14 card border-violet"><h2 class="font-display text-2xl font-bold">${X('Novedades del Día 3','Day 3 updates')}</h2><ul class="mt-3 space-y-2 text-sm text-mist">${[['Cliente ideal y mensajes definidos','Ideal customer and messaging defined'],['Estudio 3D: sudadera, camiseta oversize y gorra, con texto y colores','3D studio: hoodie, oversized tee and cap, with custom text and colors'],['Flujo de 5 pasos y módulo de riesgo cero','5-step flow and zero-risk module'],['Asistente de IA que edita tu diseño y tu tienda','AI assistant that edits your design and your store']].map(x=>`<li>✓ ${X(x[0],x[1])}</li>`).join('')}</ul></section>`,
/* ===== 1. GENERADOR 3D ===== */
gen:()=>`${H('Tu logo en 3D, en todos tus productos','Gira el producto, o simplemente dile a la IA lo que quieres.')}
<div class="card mt-6"><label class="text-sm font-bold" for="gi">Pídele a la IA</label><div class="mt-2 flex gap-2"><input id="gi" class="inp" placeholder="Ej: sudadera negra con el logo grande en la espalda" onkeydown="if(event.key==='Enter')gai()"><button class="btn" onclick="gai()">Crear</button></div><p id="gr" class="mt-2 text-sm text-ok" role="status"></p><div class="mt-3 flex flex-wrap items-center gap-2"><span class="text-xs text-mist">✨ Ideas de la IA:</span>${PRE.map((p,i)=>`<button class="chip" onclick="preset(${i})">${p[0]}</button>`).join('')}</div></div>
<div class="mt-6 grid gap-6 lg:grid-cols-5"><div class="card lg:col-span-3"><div id="stage" class="flex h-[26rem] cursor-grab items-center justify-center rounded-2xl bg-[radial-gradient(circle_at_50%_30%,#3b2fa0,#120d3d_60%,#07051A)]"></div>

function hsw(){const h=HS[S.hs];$('#hsw').innerHTML=`<div class="flex flex-wrap gap-2">${HS.map((x,i)=>`<button class="chip ${i===S.hs?'on':''}" onclick="clearInterval(S.ht);S.hs=${i};hsw()">${i+1} · ${X(x[0],x[1])}</button>`).join('')}</div><div class="card mt-4 flex flex-wrap items-center justify-between gap-4"><div class="max-w-xl"><p class="font-display text-2xl font-bold">${S.hs+1}. ${X(h[0],h[1])}</p><p class="mt-2 text-mist">${X(h[2],h[3])}</p></div><button class="btn" onclick="go('${h[4]}')">${X('Abrir','Open')}</button></div><div class="mt-3 h-1.5 rounded-full bg-line"><div class="h-full rounded-full bg-gradient-to-r from-cyan to-pink" style="width:${(S.hs+1)*20}%"></div></div>`}

const B={home(){hsw();setMode(S.mode);calc();S.ht=setInterval(()=>{S.hs=(S.hs+1)%5;hsw()},4500)},gen(){draw();const g=$('#stage');g.onpointerdown=e=>{S.drag=e.clientX;S.a0=S.ang;g.setPointerCapture(e.pointerId)};g.onpointermove=e=>{if(S.drag==null)return;S.ang=((S.a0+(e.clientX-S.drag)*.8)%360+360)%360;$('#ang').value=S.ang;tick()};g.onpointerup=()=>S.drag=null;g.style.touchAction='pan-y'},shop(){sf()},ads(){ab();al()},mail(){mb();pv()},vid(){scene(0);S.vt=setInterval(()=>scene((S.sc+1)%6),4200)}};

/* ===== Generador ===== */
function draw(){const g=$('#stage');if(!g)return;g.innerHTML=d3(S.prod,S.col,S.face,S.lx,S.ly,S.ls,S.ang,330);
$('#minis').innerHTML=Object.keys(PD).map(k=>`<div class="card lift !p-3"><div class="flex h-40 items-center justify-center">${d3(k,k===S.prod?S.col:S.col,S.face,S.lx,S.ly,S.ls,S.face==='back'?200:-20,150)}</div><p class="text-center text-sm">${PD[k].n}</p></div>`).join('')}
function tick(){const r=$('#stage .rt');if(r)r.style.transform=`rotateX(-6deg) rotateY(${S.ang}deg)`}
function spin(b){if(S.play){clearInterval(S.play);S.play=0;b.textContent='▶ Reproducir 360°';return}b.textContent='⏸ Pausar';S.play=setInterval(()=>{S.ang=(S.ang+2)%360;$('#ang').value=S.ang;tick()},30)}
function up(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.raw=r.result;toast('La IA está procesando tu logo…');prep(r.result,48,(u,ar,rem)=>{S.logo=u;S.fn=f.name;S.ar=ar;S.auto=1;S.face='front';S.ang=0;place();go('gen');$('#gr').textContent=(rem?'Quité el fondo y centré tu logo. ':'Logo listo. ')+'Lo coloqué en el pecho; mira las ideas de la IA para otras posiciones.'})};r.readAsDataURL(f)}
function place(){const b=PL[S.prod];S.lx=b[0];S.ly=b[1];S.ls=Math.round(b[2]*(S.ar>1.6?1.25:S.ar<.7?.85:1))}
const PRE=[['Pecho clásico',()=>{S.face='front';S.ang=0;place()}],['Grande y centrado',()=>{S.face='front';S.ang=0;place();S.ls=Math.min(60,Math.round(S.ls*1.55));S.ly+=8}],['Espalda',()=>{S.face='back';S.ang=180;place();S.ly=-12}],['Delante y detrás',()=>{S.face='both';S.ang=0;place()}]];
function preset(i){PRE[i][1]();S.auto=1;go('gen')}
function prep(src,tol,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,512/Math.max(im.width||150,im.height||150)),w=Math.max(1,Math.round((im.width||150)*k)),h=Math.max(1,Math.round((im.height||150)*k)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),a=d.data;let rem=false;
const cs=[0,(w-1)*4,(h-1)*w*4,((h-1)*w+w-1)*4].map(i=>[a[i],a[i+1],a[i+2],a[i+3]]).filter(p=>p[3]>200);
if(cs.length>=3){const m=[0,1,2].map(j=>cs.reduce((t,p)=>t+p[j],0)/cs.length),near=i=>a[i+3]>0&&Math.hypot(a[i]-m[0],a[i+1]-m[1],a[i+2]-m[2])<tol,seen=new Uint8Array(w*h),st=[];
for(let i=0;i<w;i++)st.push(i,(h-1)*w+i);for(let j=0;j<h;j++)st.push(j*w,j*w+w-1);
while(st.length){const p=st.pop();if(seen[p])continue;seen[p]=1;if(!near(p*4))continue;a[p*4+3]=0;rem=true;const X=p%w,Y=(p-X)/w;if(X>0)st.push(p-1);if(X<w-1)st.push(p+1);if(Y>0)st.push(p-w);if(Y<h-1)st.push(p+w)}}
x.putImageData(d,0,0);let x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y++)for(let X=0;X<w;X++)if(a[(y*w+X)*4+3]>20){if(X<x0)x0=X;if(X>x1)x1=X;if(y<y0)y0=y;if(y>y1)y1=y}
if(x1<=x0||y1<=y0)return cb(src,1,false);const cw=x1-x0+1,ch=y1-y0+1,o=document.createElement('canvas');o.width=cw;o.height=ch;o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);cb(o.toDataURL('image/png'),cw/ch,rem)};im.src=src}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function gai(){const q=$('#gi').value.trim();if(!q)return;const r=design(q.toLowerCase());if(r){go('gen');$('#gr').textContent=r}else $('#gr').textContent='No he entendido eso. Prueba: “camiseta blanca con el logo pequeño en el pecho”, “quita el logo de detrás”, “quita el fondo del logo” o “logo más grande”.'}

/* ===== Asistente IA: diseño + tienda (en producción: Claude API + Shopify Admin API) ===== */
function design(l){if(/bot[oó]n|banner|titular|t[ií]tulo|precio|oferta|descuento|pop-?up|portada|env[ií]o|dominio/.test(l))return null;const ch=[],pr={sudadera:'hoodie',hoodie:'hoodie',camiseta:'tee',camisa:'tee',gorra:'cap'};
for(const k in pr)if(l.includes(k)){S.prod=pr[k];ch.push(PD[S.prod].n.toLowerCase());if(S.auto)place()}
const c=Object.keys(CW).find(k=>l.includes(k.slice(0,-1)));if(c){S.col=CW[c];ch.push('color '+c)}
const tm=l.match(/["“]([^"”]{1,18})["”]/);if(tm&&/texto|escrib|pon/.test(l)){S.txt=tm[1].toUpperCase();ch.push('“'+S.txt+'”')}if(/(quit|borra|elimin)\w*\s+(el\s+)?texto/.test(l)){S.txt='';ch.push('texto quitado')}
const bk=/detr[aá]s|espalda|trasera/.test(l),fr=/delante|pecho|frente|frontal/.test(l);
if(/fondo/.test(l)&&/quit|sin|elimin|borra|transparent/.test(l)){prep(S.raw||S.logo,95,(u,r)=>{S.logo=u;S.ar=r;if(S.tab==='gen')go('gen')});ch.push('fondo del logo eliminado')}
else if(/(quit|elimin|borra)\w*\s+(el\s+)?logo|sin logo/.test(l)){S.face=bk?(S.face==='both'?'front':'none'):fr?(S.face==='both'?'back':'none'):'none';ch.push('logo quitado'+(bk?' de detrás':fr?' de delante':''))}
else{if(bk){S.face=fr||/ambos/.test(l)?'both':'back';S.ang=S.face==='back'?180:0;ch.push('logo '+(S.face==='back'?'detrás':'delante y detrás'))}
else if(/ambos|dos lados/.test(l)){S.face='both';ch.push('logo por ambos lados')}
else if(fr||/(pon|a[nñ]ade|pone)\w*\s+(el\s+)?logo/.test(l)){S.face=S.face==='back'||S.face==='both'?(fr?'front':'both'):'front';S.ang=0;ch.push('logo delante')}}
const mv=[[/m[aá]s arriba|s[uú]belo/,()=>S.ly-=10,'logo más arriba'],[/m[aá]s abajo|b[aá]jalo/,()=>S.ly+=10,'logo más abajo'],[/arriba|superior/,()=>S.ly=-24,'logo arriba'],[/abajo|inferior/,()=>S.ly=22,'logo abajo'],[/centrad|en el centro/,()=>{S.lx=0;S.ly=0},'logo centrado'],[/m[aá]s a la izquierda/,()=>S.lx-=10,'logo a la izquierda'],[/m[aá]s a la derecha/,()=>S.lx+=10,'logo a la derecha'],[/izquierda/,()=>S.lx=-22,'logo a la izquierda'],[/derecha/,()=>S.lx=22,'logo a la derecha'],[/enorme|muy grande/,()=>S.ls=Math.min(60,S.ls+22),'logo muy grande'],[/grande|agranda|aumenta/,()=>S.ls=Math.min(60,S.ls+12),'logo más grande'],[/mitad/,()=>S.ls=Math.max(12,S.ls/2),'logo a la mitad'],[/peque|reduce|encoge/,()=>S.ls=Math.max(12,S.ls-10),'logo más pequeño']];
let used=false;for(const [re,fn,m] of mv)if(re.test(l)&&!(used&&/arriba|abajo|izquierda|derecha/.test(re.source)&&ch.some(x=>/arriba|abajo|izquierda|derecha/.test(x)))){fn();S.auto=0;ch.push(m);if(/arriba|abajo|izquierda|derecha/.test(re.source))used=true}
return ch.length?'Hecho: '+ch.join(', ')+'. Si te gusta, pulsa “Me gusta: usar en mi tienda”.':null}
function say(t){S.chat.push({r:'ai',t});chat();sf()}
function send(i){const q=i.value.trim();if(!q)return;i.value='';S.chat.push({r:'u',t:q});chat();setTimeout(()=>{const l=q.toLowerCase(),d=design(l);if(d){if(S.tab==='gen')go('gen');return say(d)}const s=S.store;if(!s)return say('Primero crea tu tienda en la sección 2 y podré editarla.');
const c=Object.keys(CW).find(k=>l.includes(k)),m=l.match(/(\d+)\s*%/);
if(/bot[oó]n/.test(l)&&c){s.btn=CW[c];say(`Hecho: botón en ${c}.`)}
else if(/pop-?up/.test(l)){s.popup=m?`${m[1]}% de descuento si te suscribes`:'Bienvenido: -10% en tu primer pedido';say('Pop-up de bienvenida creado.')}
else if(/oferta|descuento|env[ií]o gratis/.test(l)){s.promo=/env[ií]o/.test(l)?'Envío gratis esta semana':`-${m?m[1]:15}% en toda la tienda · solo esta semana`;say('Oferta creada y visible en la cabecera de tu tienda.')}
